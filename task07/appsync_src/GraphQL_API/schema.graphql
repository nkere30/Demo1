# Define the structure of your API with the GraphQL
# schema definition language (SDL) here.

scalar AWSJSON
scalar AWSDateTime

type Query {
    getEvent(id: ID!): Event
}

type Mutation {
    createEvent(userId: Int!, payLoad: AWSJSON!): CreateEventResponse
}

type CreateEventResponse {
    id: ID!
    createdAt: AWSDateTime!
}

type Event {
    id: ID
    userId: Int
    createdAt: AWSDateTime
    payLoad: PayLoad
}

type PayLoad {
    meta: Meta
}

type Meta {
    key1: Int
    key2: String
}

schema {
    query: Query
    mutation: Mutation
}